<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源商店</title>
<link rel="stylesheet" href="store.css">
</head>
<body>

<div class="app">
  <!-- ═══════════ NAVBAR ═══════════ -->
  <div class="navbar">
    <div class="logo">🧩</div>
    <div class="nav-tabs" id="navTabs">
      <div class="nav-tab active" data-page="browse">资源主页</div>
      <div class="nav-tab" data-page="myresources">我的资源</div>
    </div>
    <div class="nav-search">
      <input type="text" placeholder="搜索资源">
      <button class="btn-search">搜索</button>
    </div>
    <div class="avatar">宇</div>
  </div>

  <!-- ═══════════ BREADCRUMB (detail only) ═══════════ -->
  <div class="breadcrumb hidden" id="breadcrumb">
    <span class="link" onclick="goBrowse()">资源主页</span>
    <span class="sep">›</span>
    <span id="breadcrumbTitle">插件详情</span>
  </div>

  <!-- ═══════════ PAGE 1: 资源主页 ═══════════ -->
  <div id="pageBrowse" class="page-with-sidebar">
    <!-- 左侧分类导航 -->
    <div class="cat-sidebar">
      <div class="cat-sidebar-title">资源主页</div>
      <div class="cat-item active" data-sub="all">所有插件</div>
      <div class="cat-item" data-sub="编辑器工具">编辑器工具</div>
      <div class="cat-item" data-sub="动画">动画</div>
      <div class="cat-item" data-sub="特效">特效</div>
      <div class="cat-item" data-sub="UI">UI</div>
      <div class="cat-item" data-sub="批量操作">批量操作</div>
      <div class="cat-item" data-sub="测试调试">测试调试</div>
      <div class="cat-item" data-sub="其他">其他</div>
    </div>
    <!-- 右侧内容 -->
    <div class="browse-content">
      <div class="filter-bar">
        <div class="sort-dropdown">
          排序规则：
          <select id="sortSelect">
            <option>热门程度</option>
            <option>最新发布</option>
            <option>最多下载</option>
          </select>
        </div>
      </div>
      <div class="card-grid" id="browseGrid"></div>
    </div>
  </div>

  <!-- ═══════════ PAGE 2: 插件详情 ═══════════ -->
  <div id="pageDetail" class="hidden">
    <div class="detail-top">
      <div class="detail-left">
        <div class="detail-preview-large">
          <div class="preview-icon">🧩</div>
          <div class="preview-name" id="detailPreviewName">批量对齐工具</div>
        </div>
      </div>
      <div class="detail-right" id="detailInfo"></div>
    </div>
    <div class="detail-bottom">
      <div class="detail-section">
        <h4>详细信息</h4>
        <div class="detail-desc" id="detailDesc"></div>
        <div id="detailMeta"></div>
      </div>
      <div class="related-section">
        <h3>相关资源推荐</h3>
        <div class="related-grid" id="relatedGrid"></div>
      </div>
    </div>
    <div class="changelog-modal hidden" id="changelogModal">
      <div class="changelog-content">
        <div class="changelog-header"><h4>更新日志</h4><button class="changelog-close" onclick="closeChangelog()">✕</button></div>
        <div class="detail-changelog" id="detailChangelog"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════ PAGE 3: 我的资源 ═══════════ -->
  <div id="pageMyResources" class="hidden">
    <div class="subtabs" id="myResSubtabs">
      <div class="subtab active" data-subtab="published">上架中</div>
      <div class="subtab" data-subtab="acquired">已获取</div>
    </div>
    <div class="filter-bar">
      <div class="btn-category">
        查看所有类别
        <span class="selected-tag">插件</span>
      </div>
      <div class="btn-filter">🔽 筛选</div>
      <div class="sort-dropdown">
        排序规则：
        <select>
          <option>上架时间</option>
          <option>下载量</option>
          <option>审核状态</option>
        </select>
      </div>
    </div>
    <div class="card-grid" id="myResGrid"></div>
  </div>
</div>

<script src="store.js"></script>

</body>
</html>
